site_name: "test"
site_description: 

nav:
  - Introduction: index.md
  - Architecture: architecture.md
  - Architecture Decisions:
      - Overview: adrs/index.md
      - "0001 Use React": adrs/0001-use-react.md

plugins:
  - techdocs-core
  # Renders ```mermaid blocks to SVG at build time. http_method POST makes the
  # plugin download the SVG into the built site; the default GET would embed
  # a kroki.io image URL, which RHDH's Content-Security-Policy blocks.
  - kroki:
      server_url: https://kroki.io
      fence_prefix: ''
      http_method: POST
      file_types:
        - svg
